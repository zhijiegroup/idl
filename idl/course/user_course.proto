syntax = "proto3";
package glory_api;
option java_package = "com.zhijiejiaoyu.glory_api.course";
option java_multiple_files = true;

import "base.proto";

message UserCourseSummary {
  int64 course_id = 1; // 课程ID
  string course_name = 2; // 课程名称
  float knowledge_hours = 3; // 知识点学时
  float skill_hours = 4; // 技能学时
  int32 course_state = 5; // 课程状态：1.进行中；2.已完成
  int32 course_origin = 6; // 课程来源：1. 从资源库加入；2.学生自己定制课程；3.老师分配课程
  int32 course_module = 7; // 1. 模块化课程；2. 非模块化课程；3. 定制课程
  string course_organization = 8; // 课程开发单位
  string course_teacher_name = 9; // 授课老师名称
  int32 course_progress = 10; // 课程进度
}

// 加入课程
message EnrollCourseRequest {
  base.BaseRequest base_request = 1;
  int64 course_id = 2; // 课程ID
}

message EnrollCourseResponse {
  base.BaseResponse base_resp = 1;
}

// 删除我的课程
message DeleteMyCourseRequest {
  base.BaseRequest base_request = 1;
  int64 course_id = 2; // 课程ID
}

message DeleteMyCourseResponse {
  base.BaseResponse base_resp = 1;
}

// 更新课程进度
// 将废弃：请改用统一进度上报 ReportCourseProgress（teaching=false）；本接口保留兼容存量客户端
message UpdateCourseProgressRequest {
  option deprecated = true;
  base.BaseRequest base_request = 1;
  int64 course_id = 2; // 课程ID
  int64 chapter_resource_id = 3; // 当前课程资源ID；后台按 (user_id, course_id, resource_id=本字段) upsert 逐节进度记录
  float chapter_resource_progress = 4; // 当前课程资源播放进度（0-100）
  int64 chapter_resource_duration = 5; // 当前课程资源总时长（整数，毫秒）
  int64 resource_play_position = 6; // 资源播放点位（整数，毫秒，视频内当前播放位置；必填；可回退，落库取最新值）
}

message UpdateCourseProgressResponse {
  option deprecated = true;
  base.BaseResponse base_resp = 1;
  int32 course_progress = 2; // 当前课程总进度(基于逐节记录聚合)
}

// 我的课程列表
message ListMyCourseRequest {
  base.BaseRequest base_request = 1;
  int32 course_state = 2; // 课程状态：1.进行中；2.已完成
  base.PaginationRequest pagination = 100;
}

message ListMyCourseResponse {
  base.BaseResponse base_resp = 1;
  repeated UserCourseSummary user_courses = 2;
  base.PaginationResponse pagination = 100;
}

// 收藏课节卡片
message FavoriteLessonItem {
  int64 course_id = 1; // 课程ID
  string course_name = 2; // 课程名称
  string course_cover_url = 3; // 课程封面
  string node_key = 4; // 课节稳定标识，用于跳转定位
  string lesson_name = 5; // 收藏课节名称
  string chapter_path = 6; // 多级路径(章节/小节/任务)
  string created_at = 7; // 收藏时间
}

// 收藏/取消收藏课节(幂等，重复调用返回成功)
message FavoriteLessonRequest {
  base.BaseRequest base_request = 1;
  int64 course_id = 2; // 课程ID
  string node_key = 3; // 课节稳定标识(= 资源ID)
  bool favorite = 4; // true 收藏；false 取消
}

message FavoriteLessonResponse {
  base.BaseResponse base_resp = 1;
}

// 我的收藏课节列表(按收藏时间倒序)
message ListMyFavoriteLessonRequest {
  base.BaseRequest base_request = 1;
  base.PaginationRequest pagination = 100;
}

message ListMyFavoriteLessonResponse {
  base.BaseResponse base_resp = 1;
  repeated FavoriteLessonItem items = 2;
  base.PaginationResponse pagination = 100;
}